version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ramie_user
      POSTGRES_PASSWORD: ramie_password
      POSTGRES_DB: ramie_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
