<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RA-MIE Personal</title>
    <link rel="stylesheet" href="/static/style.css">
    <!-- JSZip for client-side ZIP parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
    <div class="container" style="max-width: 900px;">
        <div class="header">
            <h1>RA-MIE Personal Mode</h1>
            <a href="/hospital" class="btn btn-secondary">Hospital Login</a>
        </div>

        <div class="card">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('encrypt')">Encrypt Image</button>
                <button class="tab-btn" onclick="switchTab('decrypt')">Decrypt Image</button>
            </div>

            <div id="alertBox" class="alert"></div>

            <!-- ENCRYPT TAB -->
            <div id="encrypt" class="tab-content active">
                <form id="encryptForm">
                    <div style="display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap;">
                        <!-- Left Side: Original -->
                        <div style="flex: 1; min-width: 300px;">
                            <p style="font-weight: bold; margin-bottom: 10px; color: #1e293b;">Original</p>
                            <div class="drop-zone" id="encDropZone">
                                <p id="encDropText">Drag & Drop medical image here or click to browse</p>
                                <input type="file" id="encImg" accept="image/jpeg, image/png, image/dicom" required>
                                <img id="encPreview" class="image-preview" src="" alt="Preview">
                            </div>
                        </div>

                        <!-- Right Side: Encrypted Result -->
                        <div style="flex: 1; min-width: 300px; display: none;" id="encResultContainer">
                            <p style="font-weight: bold; margin-bottom: 10px; color: #1e293b;">Encrypted (scrambled)</p>
                            <div style="position: relative; display: inline-block; width: 100%; border: 1px solid #cbd5e1; border-radius: 8px; overflow: hidden;">
                                <img id="encResultPreview" class="image-preview" src="" alt="Encrypted Result" style="display: block; width: 100%; margin: 0; border: none;">
                                <canvas id="riskGridOverlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;"></canvas>
                            </div>
                            <div style="margin-top: 15px; text-align: center;">
                                <button type="button" class="btn btn-secondary" id="downloadZipBtn" style="display:none; width: 100%;">Download ZIP</button>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Passphrase</label>
                        <input type="password" id="encPass" class="form-control" required placeholder="Enter a secure passphrase">
                        <div id="pwStrength" style="height: 5px; width: 100%; background: #e2e8f0; margin-top: 5px; border-radius: 3px; overflow: hidden;">
                            <div id="pwStrengthBar" style="height: 100%; width: 0%; background: #ef4444; transition: all 0.3s;"></div>
                        </div>
                        <small id="pwStrengthText" style="color: #64748b; font-size: 12px;">Strength: None</small>
                    </div>
                    <button type="submit" class="btn" id="encBtn" style="width: 100%;">Encrypt</button>
                    <div class="loader mt-4" id="encLoader"></div>
                </form>

                <div id="riskResult" class="card mt-4" style="display: none; background-color: #f8fafc;">
                    <h3>Risk Analysis Result</h3>
                    <div class="flex mt-4" style="justify-content: space-between;">
                        <div class="text-center">
                            <div class="badge badge-low">LOW RISK</div>
                            <h2 id="rlLow">0%</h2>
                        </div>
                        <div class="text-center">
                            <div class="badge badge-med">MED RISK</div>
                            <h2 id="rlMed">0%</h2>
                        </div>
                        <div class="text-center">
                            <div class="badge badge-high">HIGH RISK</div>
                            <h2 id="rlHigh">0%</h2>
                        </div>
                    </div>
                </div>
            </div>

            <!-- DECRYPT TAB -->
            <div id="decrypt" class="tab-content">
                <form id="decryptForm">
                    <div style="display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap;">
                        <div style="flex: 1; min-width: 300px;">
                            <div class="form-group">
                                <label>Encrypted Image (.png)</label>
                                <input type="file" id="decImg" class="form-control" accept="image/png" required>
                            </div>
                            <div class="form-group">
                                <label>Metadata JSON (.json)</label>
                                <input type="file" id="decMeta" class="form-control" accept="application/json" required>
                            </div>
                        </div>
                        
                        <!-- Decrypted Result -->
                        <div style="flex: 1; min-width: 300px; display: none;" id="decResultContainer">
                            <p style="font-weight: bold; margin-bottom: 10px; color: #1e293b;">Decrypted Result</p>
                            <img id="decResultPreview" class="image-preview" src="" alt="Decrypted Result" style="display: block; width: 100%; border: 1px solid #cbd5e1;">
                            <div style="margin-top: 15px; text-align: center;">
                                <button type="button" class="btn btn-secondary" id="downloadPngBtn" style="width: 100%;">Download PNG</button>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Passphrase</label>
                        <input type="password" id="decPass" class="form-control" required>
                    </div>
                    <button type="submit" class="btn" id="decBtn" style="width: 100%;">Decrypt</button>
                    <div class="loader mt-4" id="decLoader"></div>
                </form>
            </div>
        </div>
    </div>

    <script>
        function showAlert(msg, isError=true) {
            const box = document.getElementById('alertBox');
            box.textContent = msg;
            box.style.display = 'block';
            box.className = 'alert ' + (isError ? 'alert-error' : 'alert-success');
        }

        function hideAlert() {
            document.getElementById('alertBox').style.display = 'none';
        }

        function switchTab(tabId) {
            hideAlert();
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        let selectedFile = null;
        const encImg = document.getElementById('encImg');
        const encPreview = document.getElementById('encPreview');
        const encDropText = document.getElementById('encDropText');
        const dropZone = document.getElementById('encDropZone');

        dropZone.addEventListener('dragenter', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', e => { e.preventDefault(); dropZone.classList.remove('dragover'); });
        dropZone.addEventListener('drop', e => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                selectedFile = e.dataTransfer.files[0];
                previewFile(selectedFile);
            }
        });

        encImg.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                selectedFile = this.files[0];
                previewFile(selectedFile);
            }
        });

        function previewFile(file) {
            const reader = new FileReader();
            reader.onload = e => {
                encPreview.src = e.target.result;
                encPreview.style.display = 'inline-block';
                encDropText.style.display = 'none';
            }
            reader.readAsDataURL(file);
        }

        // Password Strength
        const encPass = document.getElementById('encPass');
        const pwBar = document.getElementById('pwStrengthBar');
        const pwText = document.getElementById('pwStrengthText');
        encPass.addEventListener('input', (e) => {
            const val = e.target.value;
            let score = 0;
            if(val.length > 5) score += 25;
            if(val.length > 10) score += 25;
            if(/[A-Z]/.test(val)) score += 25;
            if(/[0-9!@#\$%\^\&*\)\(+=._-]/.test(val)) score += 25;
            
            pwBar.style.width = score + '%';
            if (score <= 25) { pwBar.style.background = '#ef4444'; pwText.textContent = 'Strength: Weak'; }
            else if (score <= 50) { pwBar.style.background = '#f59e0b'; pwText.textContent = 'Strength: Fair'; }
            else if (score <= 75) { pwBar.style.background = '#3b82f6'; pwText.textContent = 'Strength: Good'; }
            else { pwBar.style.background = '#10b981'; pwText.textContent = 'Strength: Strong'; }
        });

        // Encrypt logic
        document.getElementById('encryptForm').addEventListener('submit', async e => {
            e.preventDefault();
            if (!selectedFile) {
                showAlert("Please select an image first.");
                return;
            }
            hideAlert();
            document.getElementById('riskResult').style.display = 'none';
            document.getElementById('encResultContainer').style.display = 'none';
            
            const btn = document.getElementById('encBtn');
            const loader = document.getElementById('encLoader');
            
            btn.disabled = true;
            loader.style.display = 'block';

            const fd = new FormData();
            fd.append('image', selectedFile);
            fd.append('passphrase', document.getElementById('encPass').value);

            try {
                const res = await fetch('/api/images/encrypt', { method: 'POST', body: fd });
                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || "Server error");
                }
                
                const imageId = res.headers.get('X-Image-ID');
                document.getElementById('rlLow').textContent = res.headers.get('X-Risk-Low') + '%';
                document.getElementById('rlMed').textContent = res.headers.get('X-Risk-Medium') + '%';
                document.getElementById('rlHigh').textContent = res.headers.get('X-Risk-High') + '%';
                
                if (imageId) {
                    document.getElementById('riskResult').style.display = 'block';
                }

                const blob = await res.blob();
                
                // Parse the ZIP client-side to show the preview
                const zip = await JSZip.loadAsync(blob);
                const pngFile = Object.values(zip.files).find(f => f.name.endsWith('.png'));
                const jsonFile = Object.values(zip.files).find(f => f.name.endsWith('.json'));
                
                if (pngFile) {
                    const pngBlob = await pngFile.async("blob");
                    const imgUrl = URL.createObjectURL(pngBlob);
                    
                    const encResultPreview = document.getElementById('encResultPreview');
                    
                    // Once image loads, draw the overlay if json is available
                    encResultPreview.onload = async () => {
                        if (jsonFile) {
                            try {
                                const metaStr = await jsonFile.async("string");
                                const meta = JSON.parse(metaStr);
                                const canvas = document.getElementById('riskGridOverlay');
                                
                                canvas.width = encResultPreview.naturalWidth;
                                canvas.height = encResultPreview.naturalHeight;
                                const ctx = canvas.getContext('2d');
                                ctx.clearRect(0, 0, canvas.width, canvas.height);
                                
                                const rows = meta.level_matrix.length;
                                const cols = meta.level_matrix[0].length;
                                
                                for (let i = 0; i < rows; i++) {
                                    for (let j = 0; j < cols; j++) {
                                        const y1 = meta.y_splits[i];
                                        const y2 = meta.y_splits[i+1];
                                        const x1 = meta.x_splits[j];
                                        const x2 = meta.x_splits[j+1];
                                        const level = meta.level_matrix[i][j];
                                        
                                        ctx.beginPath();
                                        ctx.rect(x1, y1, x2 - x1, y2 - y1);
                                        
                                        const lineWidth = Math.max(1, Math.floor(canvas.width / 300));
                                        ctx.lineWidth = lineWidth;
                                        
                                        if (level === 'HIGH') {
                                            ctx.strokeStyle = 'rgba(239, 68, 68, 0.7)';
                                            ctx.fillStyle = 'rgba(239, 68, 68, 0.15)';
                                        } else if (level === 'MEDIUM') {
                                            ctx.strokeStyle = 'rgba(245, 158, 11, 0.7)';
                                            ctx.fillStyle = 'rgba(245, 158, 11, 0.15)';
                                        } else {
                                            ctx.strokeStyle = 'rgba(16, 185, 129, 0.7)';
                                            ctx.fillStyle = 'rgba(16, 185, 129, 0.15)';
                                        }
                                        ctx.fill();
                                        ctx.stroke();
                                    }
                                }
                            } catch (e) {
                                console.error("Error drawing risk overlay:", e);
                            }
                        }
                    };
                    
                    encResultPreview.src = imgUrl;
                    document.getElementById('encResultContainer').style.display = 'block';
                    
                    const downloadBtn = document.getElementById('downloadZipBtn');
                    downloadBtn.style.display = 'inline-block';
                    downloadBtn.onclick = () => {
                        const zipUrl = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = zipUrl;
                        a.download = `ramie_encrypted_${imageId || 'file'}.zip`;
                        a.click();
                    };
                }
                
                showAlert("Encryption successful! See preview above.", false);
            } catch(err) {
                showAlert(err.message);
            } finally {
                btn.disabled = false;
                loader.style.display = 'none';
            }
        });

        // Decrypt logic
        document.getElementById('decryptForm').addEventListener('submit', async e => {
            e.preventDefault();
            hideAlert();
            document.getElementById('decResultContainer').style.display = 'none';
            
            const btn = document.getElementById('decBtn');
            const loader = document.getElementById('decLoader');
            
            btn.disabled = true;
            loader.style.display = 'block';

            const fd = new FormData();
            fd.append('encrypted_image', document.getElementById('decImg').files[0]);
            fd.append('metadata_file', document.getElementById('decMeta').files[0]);
            fd.append('passphrase', document.getElementById('decPass').value);

            try {
                const res = await fetch('/api/images/decrypt', { method: 'POST', body: fd });
                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || "Decryption failed");
                }
                
                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                
                document.getElementById('decResultPreview').src = url;
                document.getElementById('decResultContainer').style.display = 'block';
                
                const downloadBtn = document.getElementById('downloadPngBtn');
                downloadBtn.onclick = () => {
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'ramie_decrypted.png';
                    a.click();
                };
                
                showAlert("Decryption successful! See preview above.", false);
            } catch(err) {
                showAlert(err.message);
            } finally {
                btn.disabled = false;
                loader.style.display = 'none';
            }
        });
    </script>
</body>
</html>
